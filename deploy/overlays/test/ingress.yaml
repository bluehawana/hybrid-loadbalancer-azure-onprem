# Test entrypoint on the ARO dev/test router domain (default wildcard cert, edge TLS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hybrid-loadbalancer-ingress
  annotations:
    route.openshift.io/termination: edge
    haproxy.router.openshift.io/timeout: 630s
spec:
  rules:
    - host: webapp-lb.apps.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hybrid-loadbalancer
                port:
                  name: proxy
