# Test HAProxy config: points at the in-cluster mock backends instead of a real on-prem
# host, so the benchmark can kill the primary (scale onprem-mock to 0) and watch failover.
global
    log stdout format raw local0 info
    stats socket ipv4@127.0.0.1:9999 level admin
    stats timeout 30s
    hard-stop-after 30s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    retries 3
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    default-server inter 2s fall 3 rise 2

frontend fe_webapp
    bind *:8443
    default_backend be_webapp

backend be_webapp
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health
    http-check expect status 200
    default-server check
    server onprem  onprem-mock:80
    server azurevm azure-mock:80 backup

frontend stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
