apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-loadbalancer
spec:
  # Two proxy replicas so the load balancer itself is not a single point of failure.
  replicas: 2
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hybrid-loadbalancer
