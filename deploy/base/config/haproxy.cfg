# HAProxy data plane for the on-prem -> Azure failover load balancer.
#
# Pattern (reusable per service): one backend with the on-prem host as the primary
# server and an Azure VM as the `backup` server. HAProxy fails over automatically when
# on-prem health checks fail; the .NET controller drives this socket to shift traffic
# proactively (before on-prem dies) and to shift back once on-prem is stably healthy.

global
    log stdout format raw local0 info
    # Runtime API — the controller connects here (localhost, same pod) to drain/ready servers.
    stats socket ipv4@127.0.0.1:9999 level admin
    stats timeout 30s
    hard-stop-after 30s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    retries 3
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    default-server inter 2s fall 3 rise 2

# ---- Traffic entrypoint (TLS terminated at the OpenShift Route in front) ----
frontend fe_webapp
    bind *:8443
    default_backend be_webapp

backend be_webapp
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready
    http-check expect status 200
    default-server ssl verify none check
    # Primary: on-prem Windows host. Backup: Azure VM warm standby.
    server onprem  192.168.10.20:443
    server azurevm 10.20.0.10:443 backup

# ---- Prometheus metrics + stats UI ----
frontend stats
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
