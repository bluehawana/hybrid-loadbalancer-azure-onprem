apiVersion: v1
kind: Service
metadata:
  name: hybrid-loadbalancer
  labels:
    app: hybrid-loadbalancer
    app.kubernetes.io/part-of: hybrid-loadbalancer
spec:
  type: ClusterIP
  selector:
    app: hybrid-loadbalancer
  ports:
    - name: proxy
      port: 8443
      targetPort: proxy
    - name: haproxy-metrics
      port: 8404
      targetPort: haproxy-metrics
    - name: metrics
      port: 8080
      targetPort: metrics
